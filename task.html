<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-color: #e6e6e6;
        }

        .head {
            display: flex;
            justify-content: center;
        }

        h1 {
            color: rgb(0, 0, 0);
            letter-spacing: 10px;
            align-items: center;
            display: flex;
            justify-content: center;
        }

        form { 
            margin-top: 5px;
            width: 600px;
            height: fit-content;
            background-color: gold;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.5);
        }

        label {
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid rgb(145, 144, 144);
            border-radius: 80px;
            outline: none;
            margin-bottom: 8px;
        }

        .gender-box {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
        }

        .skill-box {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            width: 50%;
            padding: 12px;
            margin-top: 20px;
            margin-left: 130px;
            border: none;
            background-color: rgb(0, 0, 0);
            color: gold;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            letter-spacing: 5px;
            font-weight: bolder;
        }

        button:hover {
            background-color: white;
            color: black;
            transition: 0.2s ease-in;
        }

        .section {
            margin-top: 13px;
            padding: 10px;
            background-color: rgba(255, 248, 248, 0.425);
            border-radius: 8px;
        }

        .section h3 {
            margin-bottom: 5px;
            color: black;
            border-left: 5px solid black;
            padding-left: 10px;
        }

        #names {
            display: none;
        } 

        #passwords {
            display: none;
            color:red
        }

        @media(min-width:0px) and (max-width:667px) {
            h1 {
                font-size: 25px;
            }

            .head {
                display: flex;
                justify-content: center;
                margin: 10px;
            }

            form {
                width: 280px;
                height: 600px;
            }

            label {
                font-size: 15px;
            }

            .skill-box {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
            }

            button {
                margin-left: 50px;
                margin-top: 4px;
            }
        }
    </style>
</head>
;

<body>
    <h1>Login Form</h1>

    <div class="head">

        <form action="login">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username">
            <p id="names">UserName is Invalid</p>
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <p id="passwords">Incorrect Password</p>
            <label>Age</label>
            <input type="number" id="age" placeholder="Enter your age">
            <label>Department</label>
            <input type="text" id="department" placeholder="Enter your department">

            <div class="section">

                <h3>Gender</h3>

                <div class="gender-box">
                    <input type="radio" class="genders" name="gender" value="Female">Female
                    <input type="radio" class="genders" name="gender" value="Male">Male
                    <input type="radio" class="genders" name="gender" value="Other">Other
                </div>

            </div>
            <div class="section">

                <h3>Skills</h3>

                <div class="skill-box">

                    <div class="skill-item">
                        <input type="checkbox" class="skill" value="Full Stack Development">
                        Full Stack Development
                    </div>

                    <div class="skill-item">
                        <input type="checkbox" class="skill" value="Data Analytics">
                        Data Analytics
                    </div>

                    <div class="skill-item">
                        <input type="checkbox" class="skill" value="Cloud Computing">
                        Cloud Computing
                    </div>

                    <div class="skill-item">
                        <input type="checkbox" class="skill" value="UI/UX">
                        UI/UX
                    </div>

                </div>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script>
        let name = document.getElementById('username')
        let errorName = document.getElementById('names')
        name.addEventListener('input', () => {
            let usernameRegx = /^[a-zA-Z ]{3,}$/
            if (usernameRegx.test(name.value)) {
                console.log("Username:", name.value)
                errorName.style.display = "none"
                name.style.borderColor = "green"
                name.style.borderWidth = "2px"
                name.style.borderStyle = "solid"
            }
            else {
                console.log("Invalid username");
                errorName.style.display = "block"
                errorName.style.color = "red"
                name.style.borderColor = "red"
                name.style.borderWidth = "1px"
                name.style.borderStyle = "solid"
            }
        })

        let pass = document.getElementById('password')
        let errorPass = document.getElementById("passwords")
        pass.addEventListener('input', () => {
            let passwordRegx = /^[A-Z][a-z]{4,}[@#$%^&][0-9]{4,}$/
            if (passwordRegx.test(pass.value)) {
                console.log("Password:", pass.value)
                errorPass.style.display = "none"
                pass.style.borderColor = "green"
                pass.style.borderWidth = "2px"
                pass.style.borderStyle = "solid"
            }
            else {
                console.log("Invalid password");
                errorPass.style.display = "block"
                pass.style.borderColor = "red"
                pass.style.borderWidth = "2px"
                pass.style.borderStyle = "solid"
            }
        })

        let age = document.getElementById('age')
        age.addEventListener('input', () => {
            if (age.value >= 18) {
                console.log("age:", age.value)
            }
            else {
                console.log("Invalid age");
            }
        })

        let gender = document.getElementsByClassName('genders')
        Array.from(gender).forEach(find => {
            find.addEventListener('input', () => {
                console.log("Gender:", find.value);
            })
        })

        let dept = document.getElementById('department')
        dept.addEventListener('input', () => {
            let deptRegx = /^[A-Z][a-zA-Z ]+$/
            if (deptRegx.test(dept.value)) {
                console.log("Department:", dept.value);
            }
            else {
                console.log("Invalid Department Name");
            }
        })

        let skill = document.getElementsByClassName('skill')
        Array.from(skill).forEach(select => {
            select.addEventListener('input', () => {
                if (select.checked) {
                    console.log("Skills:", select.value);
                }
            })
        })
    </script>
</body>

</html>
